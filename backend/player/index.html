<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우사기의 크리스마스</title>
<style>
  html,body{margin:0;height:100%;background:#0b1026;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #wrap{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;margin:0 auto}
  canvas{width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,16,38,.55);backdrop-filter:blur(2px)}
  #ui.hide{display:none}
  #play{font:800 20px system-ui;padding:16px 38px;border-radius:999px;border:0;background:#e5484d;color:#fff;cursor:pointer;
        box-shadow:0 0 0 6px rgba(229,72,77,.25),0 10px 30px rgba(0,0,0,.4)}
  #ui small{color:#c9d1ff;font-size:14px}
  #styles{position:absolute;top:8.5%;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:4px;border-radius:999px;
          background:rgba(7,11,31,.55);backdrop-filter:blur(4px);z-index:3}
  #styles button{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:7px 12px;border-radius:999px;border:0;
          background:transparent;color:#c9d1ff;cursor:pointer}
  #styles button.on{background:#f2c14e;color:#1a1544}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="styles"><button data-s="ascii">ASCII</button><button data-s="ansi">ANSI</button><button data-s="pixel">PIXEL</button></div>
  <div id="ui">
    <button id="play">▶ 시작하기</button>
    <small id="msg">🎧 이어폰을 끼면 소리가 머리 주위를 돌아요</small>
  </div>
</div>
<script>
// ───────── 설정 ─────────
const W = 1080, H = 1920, CX = 540, FOOT = 1330;
const BPM = 128, BEAT = 60 / BPM, TOTAL = 31;
let STYLE = 'ascii', NAME = 'SANTA PENGU', EDITION = 'SCARF EDITION', TITLE = 'Pengu Carol #1', HANDLE = '@PENGU_CAROL';
const RED = '#e5484d', GREEN = '#3fb27f', GOLD = '#f2c14e', SNOW = '#f4f6ff';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const clamp01 = x => Math.min(Math.max(x, 0), 1);
let sets = [], END = TOTAL, audioUrl = null, audioBuf = null, notes = [];

// ───────── 이미지 준비: 배경 제거 + 크기 맞춤 + 파티클 + RGB 분리용 색 버전 ─────────
const STEP = 10, RAMP = ':-=+*%#@', GLYPHS_DARK = '01{}[]<>/$&';
// 렌더 스타일: ascii(색 글자) / ansi(16색 블록 셰이드) / pixel(저해상도 도트)
const look = S => STYLE === 'ansi' ? S.ansi : STYLE === 'pixel' ? S.pix : S.asc;
const tinted = (S, col) => { const key = STYLE + col; if (S.tints[key]) return S.tints[key];
  const src = look(S), t = document.createElement('canvas'); t.width = S.w; t.height = S.h; const x = t.getContext('2d');
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = col; x.fillRect(0, 0, S.w, S.h); return S.tints[key] = t; };
const ANSI16 = [[0,0,0],[205,49,49],[13,188,121],[229,229,16],[36,114,200],[188,63,188],[17,168,205],[229,229,229],
  [102,102,102],[241,76,76],[35,209,139],[245,245,67],[59,142,234],[214,112,214],[41,184,219],[255,255,255]];
const nearestAnsi = (r, g2, b) => { let best = 0, bd = 1e9; ANSI16.forEach(([R, G, B], i) => { const d = (R - r) ** 2 + (G - g2) ** 2 + (B - b) ** 2; if (d < bd) { bd = d; best = i; } }); return ANSI16[best]; };
function prepImage(img) {
  const scale = Math.min(980 / img.width, 1110 / img.height); // 화면 꽉 차게 (상단 HUD 아래까지)
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const o = c.getContext('2d'); o.drawImage(img, 0, 0, w, h);
  const id = o.getImageData(0, 0, w, h), d = id.data;
  let opaque = true; for (let i = 3; i < d.length; i += 4 * 97) if (d[i] < 250) { opaque = false; break; }
  if (opaque) { // 모서리 색과 비슷한 픽셀을 투명하게
    const bg = [d[0], d[1], d[2]];
    for (let i = 0; i < d.length; i += 4) {
      const dist = Math.hypot(d[i] - bg[0], d[i + 1] - bg[1], d[i + 2] - bg[2]);
      if (dist < 40) d[i + 3] = 0; else if (dist < 70) d[i + 3] = Math.min(d[i + 3], (dist - 40) / 30 * 255);
    }
    o.putImageData(id, 0, 0);
  }
  const tint = (src, col) => { const t = document.createElement('canvas'); t.width = w; t.height = h; const x = t.getContext('2d');
    x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = col; x.fillRect(0, 0, w, h); return t; };
  // 터미널 스타일: 픽셀을 색 글자로 바꾼 버전
  const asc = document.createElement('canvas'); asc.width = w; asc.height = h; const ax = asc.getContext('2d');
  ax.font = `700 ${STEP + 3}px ui-monospace,Menlo,Consolas,monospace`; ax.textAlign = 'center'; ax.textBaseline = 'middle';
  const parts = [];
  for (let y = 0; y < h; y += STEP) for (let x = 0; x < w; x += STEP) {
    const i = (Math.min(h - 1, y + STEP / 2 | 0) * w + Math.min(w - 1, x + STEP / 2 | 0)) * 4; if (d[i + 3] < 120) continue;
    const lum = (.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]) / 255;
    const ch = lum < .3 ? GLYPHS_DARK[(x * 7 + y * 3) % GLYPHS_DARK.length] : RAMP[Math.min(RAMP.length - 1, Math.round(lum * (RAMP.length - 1)))];
    const k = v => Math.min(255, 50 + v * .9) | 0, col = `rgb(${k(d[i])},${k(d[i + 1])},${k(d[i + 2])})`;
    ax.fillStyle = col; ax.fillText(ch, x + STEP / 2, y + STEP / 2);
    parts.push({ tx: CX - w / 2 + x, ty: FOOT - h + y, col, ch, r: Math.random(), a: Math.random() * Math.PI * 2 });
  }
  // ANSI: 16색 팔레트 + ░▒▓█ 셰이드 블록
  const ansi = document.createElement('canvas'); ansi.width = w; ansi.height = h; const nx = ansi.getContext('2d');
  for (const q of parts) {
    const i = (Math.min(h - 1, q.ty - (FOOT - h) + STEP / 2 | 0) * w + Math.min(w - 1, q.tx - (CX - w / 2) + STEP / 2 | 0)) * 4;
    const [R, G, B] = nearestAnsi(d[i], d[i + 1], d[i + 2]), lum = (.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]) / 255;
    const shade = lum > .75 ? 1 : lum > .5 ? .8 : lum > .25 ? .6 : .9; // █ ▓ ▒ (어두운 외곽선은 진하게)
    q.ansi = `rgba(${R},${G},${B},${shade})`;
    const x0 = q.tx - (CX - w / 2), y0 = q.ty - (FOOT - h);
    nx.fillStyle = q.ansi; nx.fillRect(x0, y0, STEP, STEP);
    if (shade < 1) { nx.fillStyle = 'rgba(0,0,0,.35)'; for (let k = 0; k < STEP; k += 3) nx.fillRect(x0 + (k % 6 ? 0 : 1), y0 + k, STEP, 1); }
  }
  // PIXEL: 저해상도로 줄였다가 색 단계 줄이고 칼같이 확대
  const PX = 12, sw = Math.ceil(w / PX), shh = Math.ceil(h / PX);
  const sm = document.createElement('canvas'); sm.width = sw; sm.height = shh; const sx = sm.getContext('2d');
  sx.drawImage(c, 0, 0, sw, shh); const sd = sx.getImageData(0, 0, sw, shh), dd = sd.data;
  for (let i = 0; i < dd.length; i += 4) { for (let k = 0; k < 3; k++) dd[i + k] = Math.round(dd[i + k] / 51) * 51; dd[i + 3] = dd[i + 3] > 110 ? 255 : 0; }
  sx.putImageData(sd, 0, 0);
  const pix = document.createElement('canvas'); pix.width = w; pix.height = h; const px = pix.getContext('2d');
  px.imageSmoothingEnabled = false; px.drawImage(sm, 0, 0, sw * PX, shh * PX);
  px.strokeStyle = 'rgba(0,0,0,.12)'; px.lineWidth = 1; px.globalCompositeOperation = 'source-atop';
  for (let x = 0; x <= w; x += PX) { px.beginPath(); px.moveTo(x + .5, 0); px.lineTo(x + .5, h); px.stroke(); }
  for (let y = 0; y <= h; y += PX) { px.beginPath(); px.moveTo(0, y + .5); px.lineTo(w, y + .5); px.stroke(); }
  return { img: c, asc, ansi, pix, w, h, parts, tints: {} };
}

function drawImg(S, { dx = 0, dy = 0, sx = 1, sy = 1, rot = 0, alpha = 1, src = look(S), center = false } = {}) {
  g.save(); g.globalAlpha = alpha; g.translate(CX + dx, FOOT + dy - (center ? S.h / 2 : 0)); g.rotate(rot); g.scale(sx, sy);
  g.drawImage(src, -S.w / 2, center ? -S.h / 2 : -S.h, S.w, S.h); g.restore();
}

// ───────── 스테이지: 이미지가 난리 치는 구간들 ─────────
function stGather(S, p) { // 하늘에서 눈처럼 내려와 모이기
  for (const q of S.parts) {
    const k = ease((p * 1.6 - q.r * .6));
    const x = q.tx + Math.sin(q.a + p * 9) * 140 * (1 - k), y = q.ty - (1 - k) * (900 + q.r * 700);
    g.globalAlpha = .35 + .65 * k; dot(q, x, y);
  }
  g.globalAlpha = 1;
  if (p > .8) drawImg(S, { alpha: (p - .8) / .2 });
}
function stBounce(S, t) { // 쿵쿵: 박자마다 찌부·점프·줌
  const ph = (t / BEAT) % 1, hit = Math.exp(-ph * 9);
  ring(hit);
  drawImg(S, { dy: -Math.sin(Math.PI * ph) * 90, sx: 1 + .22 * hit, sy: 1 - .22 * hit + .06 * Math.sin(Math.PI * ph) });
}
function stGlitch(S, t) { // 글리치: 가로 조각 밀림 + RGB 분리 + 덜덜
  const beat = Math.floor(t / (BEAT / 2)), seed = n => { const x = Math.sin(beat * 91.7 + n * 13.1) * 43758.5; return x - Math.floor(x); };
  const strong = seed(0) > .35, jx = (seed(1) - .5) * 40, split = strong ? 18 + seed(2) * 30 : 6;
  drawImg(S, { src: tinted(S, 'rgba(40,230,255,1)'), dx: jx - split, alpha: .7 }); drawImg(S, { src: tinted(S, 'rgba(255,40,80,1)'), dx: jx + split, alpha: .7 });
  const N = 22, sh = S.h / N;
  for (let i = 0; i < N; i++) {
    const off = strong && seed(i + 5) > .6 ? (seed(i + 40) - .5) * 220 : 0;
    g.drawImage(look(S), 0, i * sh, S.w, sh + 1, CX - S.w / 2 + jx + off, FOOT - S.h + i * sh, S.w, sh + 1);
  }
  if (strong) { g.fillStyle = 'rgba(255,255,255,.08)'; for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 2); }
}
function stJelly(S, t) { // 젤리: 물결치며 출렁
  const N = 90, sh = S.h / N, squish = Math.sin(t * 2 * Math.PI / BEAT) * .08;
  for (let i = 0; i < N; i++) {
    const top = 1 - i / N, off = Math.sin(i * .18 + t * 9) * 60 * top;
    const y = FOOT - S.h * (1 + squish) + i * sh * (1 + squish);
    g.drawImage(look(S), 0, i * sh, S.w, sh + 1, CX - S.w / 2 + off, y, S.w, sh * (1 + squish) + 1);
  }
}
function stSpin(S, p, t) { // 회오리: 빙글빙글 + 잔상 분신
  const rot = ease(p) * Math.PI * 6, pulse = 1 + .12 * Math.exp(-((t / BEAT) % 1) * 7);
  const r = 300 * Math.sin(Math.PI * p);
  for (let k = 0; k < 6; k++) {
    const a = rot * 1.3 + k * Math.PI / 3;
    drawImg(S, { center: true, dx: Math.cos(a) * r, dy: Math.sin(a) * r * .7, rot: -rot + k, sx: .38, sy: .38, alpha: .35 });
  }
  drawImg(S, { center: true, rot: Math.sin(rot) * .5, sx: pulse * Math.cos(rot * .5), sy: pulse });
}
function stBoom(S, p) { // 펑! 터져서 눈처럼 흩날리기
  if (p < .08) drawImg(S, { sx: 1 + p * 4, sy: 1 + p * 4, alpha: 1 - p / .08 });
  for (const q of S.parts) {
    const out = ease(p * 2.2), fall = Math.max(0, p - .35);
    const x = q.tx + Math.cos(q.a) * 700 * out * (.3 + q.r) + Math.sin(q.a * 3 + p * 8) * 40 * fall;
    const y = q.ty + Math.sin(q.a) * 700 * out * (.3 + q.r) + fall * fall * 900;
    g.globalAlpha = 1 - clamp01((p - .6) / .4) * .5; dot(q, x, y, fall > .1 && q.r > .5 ? SNOW : null);
  }
  g.globalAlpha = 1;
}
function stReform(S, p) { // 다음 이미지로 다시 뭉치기
  for (const q of S.parts) {
    const k = ease(p * 1.4 - q.r * .3), sx = CX + Math.cos(q.a) * 900, sy = H + 100;
    g.globalAlpha = .4 + .6 * k; dot(q, sx + (q.tx - sx) * k, sy + (q.ty - sy) * k);
  }
  g.globalAlpha = 1;
  if (p > .75) drawImg(S, { alpha: (p - .75) / .25, sx: 1 + .1 * (1 - p), sy: 1 + .1 * (1 - p) });
}
function dot(q, x, y, col) {
  if (STYLE === 'pixel') { g.fillStyle = col || q.col; g.fillRect(x | 0, y | 0, 12, 12); }
  else if (STYLE === 'ansi') { g.fillStyle = col || q.ansi; g.fillRect(x, y, STEP, STEP); }
  else { g.fillStyle = col || q.col; g.font = `700 ${STEP + 3}px ui-monospace,Menlo,monospace`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(q.ch, x + 5, y + 5); }
}
function ring(k) { if (k < .05) return; g.strokeStyle = `rgba(242,193,78,${k * .8})`; g.lineWidth = 6; g.beginPath(); g.ellipse(CX, FOOT, 380 * (1.4 - k), 60 * (1.4 - k), 0, 0, 7); g.stroke(); }

const STAGES = [ // [이름, 시작, 끝, 그리기(S, p, t)]
  ['TITLE', 0, 2.8, null],
  ['하늘에서 뚝', 2.8, 7, (S, p) => stGather(S, p)],
  ['쿵쿵', 7, 11, (S, p, t) => stBounce(S, t)],
  ['지지직', 11, 15, (S, p, t) => stGlitch(S, t)],
  ['출렁출렁', 15, 19, (S, p, t) => stJelly(S, t)],
  ['회오리', 19, 24, (S, p, t) => stSpin(S, p, t)],
  ['펑!', 24, 28.5, (S, p) => stBoom(S, p)],
  ['다시 뭉치기', 28.5, TOTAL, (S, p) => stReform(S, p)],
];

// 기본 캐릭터: 오리지널 산타 펭귄
function defaultCharacter() {
  const oc = document.createElement('canvas'); oc.width = 600; oc.height = 720;
  const o = oc.getContext('2d');
  const ell = (x0, y0, x1, y1, f) => { o.fillStyle = f; o.beginPath(); o.ellipse((x0 + x1) / 2, (y0 + y1) / 2, (x1 - x0) / 2, (y1 - y0) / 2, 0, 0, 7); o.fill(); };
  const rr = (x0, y0, x1, y1, r, f) => { o.fillStyle = f; o.beginPath(); o.roundRect(x0, y0, x1 - x0, y1 - y0, r); o.fill(); };
  const poly = (pts, f) => { o.fillStyle = f; o.beginPath(); pts.forEach(([x, y], i) => i ? o.lineTo(x, y) : o.moveTo(x, y)); o.fill(); };
  const NAVY = '#283454', WHITE = '#eeeee8', OR = '#f5a032', RED = '#c82832', PINK = '#f096a0';
  ell(90, 180, 510, 680, NAVY); ell(160, 300, 440, 660, WHITE);
  ell(40, 380, 150, 560, NAVY); ell(450, 380, 560, 560, NAVY);
  ell(180, 650, 290, 710, OR); ell(310, 650, 420, 710, OR);
  ell(210, 300, 260, 360, '#141418'); ell(340, 300, 390, 360, '#141418');
  ell(228, 310, 242, 326, WHITE); ell(358, 310, 372, 326, WHITE);
  poly([[270, 360], [330, 360], [300, 400]], OR);
  ell(170, 360, 220, 390, PINK); ell(380, 360, 430, 390, PINK);
  rr(120, 440, 480, 500, 25, RED); rr(370, 470, 430, 600, 20, RED);
  poly([[130, 230], [470, 230], [420, 60], [300, 10]], RED);
  rr(110, 200, 490, 260, 30, WHITE); ell(270, 0, 340, 60, WHITE);
  return oc;
}

// ───────── 음악: 징글벨(퍼블릭 도메인) + 8D(HRTF 회전) ─────────
const A_PART = [['B4',1],['B4',1],['B4',2],['B4',1],['B4',1],['B4',2],['B4',1],['D5',1],['G4',1.5],['A4',.5],['B4',4],
  ['C5',1],['C5',1],['C5',1.5],['C5',.5],['C5',1],['B4',1],['B4',1],['B4',.5],['B4',.5]];
const MEL = [...A_PART, ['B4',1],['A4',1],['A4',1],['B4',1],['A4',2],['D5',2], ...A_PART, ['D5',1],['D5',1],['C5',1],['A4',1],['G4',4]];
const CHORDS = 'G G G G C G A D G G G G C G D G'.split(' ');
const ROOT = { G: 'G2', C: 'C3', A: 'A2', D: 'D3' };
const TRIAD = { G: ['G3','B3','D4'], C: ['C4','E4','G4'], A: ['A3','C4','E4'], D: ['D4','F4','A4'] };
const hz = n => 440 * 2 ** (({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[n[0]] + 12 * (+n.at(-1) + 1) - 69) / 12);

function startMusic(ac, buf) {
  const t0 = ac.currentTime + .15;
  const master = ac.createDynamicsCompressor(); master.connect(ac.destination);
  const bus = ac.createGain(); bus.gain.value = .5;
  const panner = new PannerNode(ac, { panningModel: 'HRTF', distanceModel: 'inverse', refDistance: 1 });
  bus.connect(panner).connect(master);
  // 리버브
  const ir = ac.createBuffer(2, ac.sampleRate * 1.6, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const b = ir.getChannelData(ch); for (let i = 0; i < b.length; i++) b[i] = (Math.random() * 2 - 1) * Math.exp(-i / ac.sampleRate * 3.5); }
  const verb = new ConvolverNode(ac, { buffer: ir }), wet = new GainNode(ac, { gain: .2 });
  bus.connect(verb).connect(wet).connect(master);
  // 8초에 한 바퀴 머리 주위를 도는 위치
  const N = Math.ceil(END * 60), xs = new Float32Array(N), zs = new Float32Array(N);
  for (let i = 0; i < N; i++) { const a = 2 * Math.PI * (i / 60) / 8; xs[i] = Math.sin(a) * 1.5; zs[i] = -Math.cos(a) * 1.5; }
  if (panner.positionX) { panner.positionX.setValueCurveAtTime(xs, t0, END); panner.positionZ.setValueCurveAtTime(zs, t0, END); }
  if (buf) { // 관리자가 올린 음원을 8D로 재생
    const src = new AudioBufferSourceNode(ac, { buffer: buf });
    src.connect(bus); src.start(t0); return t0;
  }

  const env = (gain, at, peak, decay) => { gain.setValueAtTime(0, at); gain.linearRampToValueAtTime(peak, at + .005); gain.setTargetAtTime(0, at + .005, decay); };
  const osc = (f, at, dur, peak, decay, type = 'sine') => {
    const o = new OscillatorNode(ac, { type, frequency: f }), gn = ac.createGain();
    env(gn.gain, at, peak, decay); o.connect(gn).connect(bus); o.start(at); o.stop(at + dur + decay * 5); return o;
  };
  const bell = (f, at, dur) => {
    const car = osc(f, at, dur, .22, dur * .35);
    const mod = new OscillatorNode(ac, { frequency: f * 3.5 }), mg = ac.createGain();
    mg.gain.setValueAtTime(f * 1.4, at); mg.gain.setTargetAtTime(0, at, .25);
    mod.connect(mg).connect(car.frequency); mod.start(at); mod.stop(at + dur + 2);
    osc(f * 2, at, dur, .06, dur * .25);
  };
  let t = t0;
  for (const [n, b] of MEL) { bell(hz(n), t, b * BEAT); t += b * BEAT; }
  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  noise.getChannelData(0).forEach((_, i, a) => a[i] = Math.random() * 2 - 1);
  CHORDS.forEach((c, bar) => {
    const s = t0 + bar * 4 * BEAT;
    for (let k = 0; k < 4; k++) {
      const at = s + k * BEAT;
      osc(hz(ROOT[c]) * (k % 2 ? 1.5 : 1), at, BEAT, .3, .12);           // 베이스
      const kick = new OscillatorNode(ac, { frequency: 140 }), kg = ac.createGain();  // 킥
      kick.frequency.exponentialRampToValueAtTime(45, at + .12); env(kg.gain, at, .55, .08);
      kick.connect(kg).connect(bus); kick.start(at); kick.stop(at + .4);
    }
    for (const n of TRIAD[c]) {                                            // 패드
      const o = new OscillatorNode(ac, { type: 'triangle', frequency: hz(n) }), gn = ac.createGain();
      gn.gain.setValueAtTime(0, s); gn.gain.linearRampToValueAtTime(.035, s + .3); gn.gain.setTargetAtTime(0, s + 3 * BEAT, .3);
      o.connect(gn).connect(bus); o.start(s); o.stop(s + 4 * BEAT + 1);
    }
    for (let k = 0; k < 8; k++) {                                          // 썰매 방울
      const at = s + k * BEAT / 2, src = new AudioBufferSourceNode(ac, { buffer: noise, playbackRate: .8 + Math.random() * .4 });
      const hp = new BiquadFilterNode(ac, { type: 'highpass', frequency: 6000 }), gn = ac.createGain();
      env(gn.gain, at, k % 2 ? .22 : .12, .035);
      src.connect(hp).connect(gn).connect(bus); src.start(at, Math.random() * .5, .3);
    }
  });
  return t0;
}


// ───────── 배경: 밤하늘 + 별 + 눈 + 눈언덕 ─────────
const stars = Array.from({ length: 110 }, () => [Math.random() * W, Math.random() * 1100, Math.random()]);
const flakes = Array.from({ length: 220 }, () => [Math.random() * W, Math.random() * H, Math.random()]);
const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#070b1f'); sky.addColorStop(.55, '#1a1544'); sky.addColorStop(1, '#2a1a4a');
function background(t) {
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  for (const [x, y, k] of stars) { g.fillStyle = `rgba(255,255,255,${.25 + .5 * Math.abs(Math.sin(t * (1 + k * 2) + k * 9))})`; g.fillRect(x, y, 2 + k * 2, 2 + k * 2); }
  const glow = g.createRadialGradient(CX, FOOT, 50, CX, FOOT, 520); glow.addColorStop(0, 'rgba(242,193,78,.18)'); glow.addColorStop(1, 'rgba(242,193,78,0)');
  g.fillStyle = glow; g.fillRect(0, FOOT - 520, W, 1040);
  g.fillStyle = '#dfe6ff'; g.beginPath(); g.ellipse(CX, FOOT + 120, 760, 150, 0, Math.PI, 0); g.lineTo(W + 300, H); g.lineTo(-300, H); g.fill();
  g.fillStyle = '#c3cdf5'; g.beginPath(); g.ellipse(CX - 300, FOOT + 160, 500, 110, 0, Math.PI, 0); g.fill();
}
function snowfall(t) {
  for (const f of flakes) {
    const y = (f[1] + t * (50 + 90 * f[2])) % H, x = (f[0] + 30 * Math.sin(t * .8 + f[2] * 12) + W) % W;
    g.fillStyle = `rgba(255,255,255,${.4 + .5 * f[2]})`; g.beginPath(); g.arc(x, y, 1.5 + f[2] * 3, 0, 7); g.fill();
  }
}

// ───────── HUD ─────────
function pill(x, y, text, bg, fg, alignRight) {
  g.font = '700 30px system-ui,sans-serif'; const w = g.measureText(text).width + 44;
  const x0 = alignRight ? x - w : x;
  g.fillStyle = bg; g.beginPath(); g.roundRect(x0, y, w, 56, 28); g.fill();
  g.fillStyle = fg; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(text, x0 + 22, y + 29);
}
function dday() {
  const now = new Date(), xmas = new Date(now.getFullYear(), 11, 25);
  const d = Math.ceil((xmas - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return d > 0 ? `🎄 D-${d}` : d === 0 ? '🎄 MERRY CHRISTMAS' : '❄ HAPPY WINTER';
}
function hud(t, tRaw, stageName) {
  pill(40, 50, dday(), 'rgba(229,72,77,.9)', '#fff');
  pill(W - 40, 50, `🎁 ${HANDLE}`, 'rgba(255,255,255,.12)', '#fff', true);
  g.textAlign = 'left'; g.textBaseline = 'top'; g.font = '600 24px system-ui'; g.fillStyle = 'rgba(220,226,255,.7)';
  g.fillText(`${NAME} · ${EDITION}`, 44, 124);

  // 방명록 전광판
  if (notes.length) {
    const line = notes.map(n => `💌 ${n.name || '익명'}: ${n.text}`).join('      ');
    g.font = '600 30px system-ui'; const lw = g.measureText(line).width + 200;
    g.fillStyle = 'rgba(7,11,31,.55)'; g.fillRect(0, 1452, W, 54);
    g.save(); g.beginPath(); g.rect(0, 1452, W, 54); g.clip();
    g.fillStyle = '#fff'; g.textBaseline = 'middle'; const x = W - ((tRaw * 120) % (lw + W));
    g.fillText(line, x, 1480); g.restore();
  }

  // 하단 카드
  g.fillStyle = 'rgba(26,21,68,.88)'; g.beginPath(); g.roundRect(40, 1540, W - 80, 330, 36); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.15)'; g.lineWidth = 2; g.stroke();
  g.textBaseline = 'top'; g.fillStyle = '#fff'; g.font = '800 46px system-ui'; g.fillText(TITLE, 84, 1580);
  g.font = '600 26px system-ui'; g.fillStyle = GOLD; g.fillText(`8D WINTER MIX · ${stageName}`, 86, 1645);
  // 사탕 지팡이 진행바
  const bx = 84, by = 1730, bw = 680, bh = 26, prog = clamp01(tRaw / END);
  g.save(); g.beginPath(); g.roundRect(bx, by, bw, bh, 13); g.clip();
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(bx, by, bw, bh);
  g.beginPath(); g.rect(bx, by, bw * prog, bh); g.clip();
  g.fillStyle = '#fff'; g.fillRect(bx, by, bw, bh); g.fillStyle = RED;
  for (let x = bx - 40 - (tRaw * 60) % 40; x < bx + bw; x += 40) { g.beginPath(); g.moveTo(x, by + bh); g.lineTo(x + 20, by + bh); g.lineTo(x + 40, by); g.lineTo(x + 20, by); g.fill(); }
  g.restore();
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  g.font = '600 24px system-ui'; g.fillStyle = 'rgba(255,255,255,.75)';
  g.fillText(mmss(tRaw), bx, by + 42); g.textAlign = 'right'; g.fillText(mmss(END), bx + bw, by + 42);
  // 8D 궤도: 소리가 지금 머리 어디쯤 있는지
  const ox = 900, oy = 1705, R = 92, a = 2 * Math.PI * tRaw / 8;
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.setLineDash([6, 10]);
  g.beginPath(); g.arc(ox, oy, R, 0, 7); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(ox, oy, 26, 0, 7); g.fill();
  g.fillStyle = '#1a1544'; g.beginPath(); g.arc(ox - 9, oy - 4, 4, 0, 7); g.arc(ox + 9, oy - 4, 4, 0, 7); g.fill();
  const nx = ox + Math.sin(a) * R, ny = oy - Math.cos(a) * R;
  g.fillStyle = GOLD; g.beginPath(); g.arc(nx, ny, 16, 0, 7); g.fill();
  g.fillStyle = '#1a1544'; g.font = '800 20px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♪', nx, ny + 1);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = '700 22px system-ui'; g.fillText('8D', ox, oy + R + 26);
}

function titleCard(t) {
  const al = clamp01((2.8 - t) / .5) * clamp01(t / .3);
  g.globalAlpha = al; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 4;
  for (let i = 0; i < 12; i++) { const a = i / 12 * 7 + t; g.beginPath(); g.arc(CX + Math.cos(a) * 330, 780 + Math.sin(a) * 330, 10, 0, 7); g.stroke(); }
  g.fillStyle = GOLD; g.font = '700 34px system-ui'; g.fillText('🎧 이어폰 준비됐나요?', CX, 600);
  g.fillStyle = '#fff'; g.font = '900 92px system-ui'; g.fillText(TITLE, CX, 760);
  g.font = '600 32px system-ui'; g.fillStyle = 'rgba(220,226,255,.85)'; g.fillText('소리가 머리 주위를 빙글빙글 돌아요', CX, 860);
  g.globalAlpha = 1;
}

// ───────── 렌더 루프 ─────────
let ac = null, start = 0, looping = true, loops = 0;
function frame() {
  const tRaw = ac ? Math.max(0, ac.currentTime - start) : 0; // 재시작 직후 음수 시간 방지 (반복 시 멈춤 버그)
  if (ac && tRaw >= END) { loops++; start = startMusic(ac, audioBuf); requestAnimationFrame(frame); return; } // 무한 반복
  const cycle = loops * Math.ceil(END / TOTAL) + Math.floor(tRaw / TOTAL), t = tRaw % TOTAL;
  let st = STAGES.find(s => t >= s[1] && t < s[2]) || STAGES[0];
  if (st[0] === 'TITLE' && cycle > 0) st = ['쿵쿵', 0, 2.8, (S, p, tt) => stBounce(S, tt)];
  const S = sets[(((cycle * 3 + (t >= 15) + (t >= 28.5)) % sets.length) + sets.length) % sets.length];
  const p = clamp01((t - st[1]) / (st[2] - st[1]));

  background(t);
  if (!ac) drawImg(S, { dy: -Math.abs(Math.sin(performance.now() / 600)) * 20 });
  else if (st[3]) st[3](S, p, t);
  snowfall(tRaw);
  if (ac && st[0] === 'TITLE') titleCard(t);
  hud(t, tRaw, st[0] === 'TITLE' ? '준비' : st[0]);
  requestAnimationFrame(frame);
}

// ───────── 시작 ─────────
sets = [prepImage(defaultCharacter())];
frame();
document.getElementById('play').onclick = async () => {
  if (ac) await ac.close();
  ac = new AudioContext(); await ac.resume(); loops = 0;
  const btn = document.getElementById('play');
  if (audioUrl && !audioBuf) {
    btn.textContent = '음원 불러오는 중...';
    try { audioBuf = await ac.decodeAudioData(await (await fetch(audioUrl)).arrayBuffer()); } catch { audioUrl = null; }
  }
  END = audioBuf ? audioBuf.duration : TOTAL;
  start = startMusic(ac, audioBuf);
  document.getElementById('ui').classList.add('hide');
  if (!looping) { looping = true; requestAnimationFrame(frame); }
};

// 사용자 스타일 선택 (브라우저에 기억)
let picked = null;
try { picked = localStorage.getItem('style'); } catch {}
function setStyle(v, save = true) {
  if (!['ascii', 'ansi', 'pixel'].includes(v)) v = 'ascii';
  STYLE = v;
  document.querySelectorAll('#styles button').forEach(b => b.classList.toggle('on', b.dataset.s === v));
  if (save) { picked = v; try { localStorage.setItem('style', v); } catch {} }
}
document.querySelectorAll('#styles button').forEach(b => b.onclick = () => setStyle(b.dataset.s));
setStyle(picked || 'ascii', false);

// 관리자가 올린 이미지·음원·문구 + 방명록 전광판
const loadImg = url => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = url; });
(async () => {
  try {
    const m = await (await fetch('/api/media')).json();
    const imgs = (await Promise.allSettled(m.images.map(x => loadImg(x.url)))).filter(r => r.status === 'fulfilled').map(r => r.value);
    if (imgs.length) sets = imgs.map(prepImage);
    if (m.audio) audioUrl = m.audio.url;
    if (m.settings) ({ name: NAME, edition: EDITION, title: TITLE, handle: HANDLE } = m.settings);
    if (!picked && m.settings?.style) setStyle(m.settings.style, false); // 관리자 기본값 (사용자가 고른 게 없을 때)
  } catch {}
})();
async function loadNotes() { try { notes = await (await fetch('/api/guestbook?limit=15')).json(); } catch {} }
loadNotes(); setInterval(loadNotes, 30000);
fetch('/api/visit', { method: 'POST' }).catch(() => {}); // 접속자 수 집계
</script>
