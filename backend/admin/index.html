<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>방명록 관리자</title>
<style>
  body{margin:0;background:#07090c;color:#dde3e8;font:14px system-ui,sans-serif}
  main{max-width:900px;margin:0 auto;padding:20px}
  h1{font-size:18px;color:#5fd3a0}
  input,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #283038;background:#11161c;color:#dde3e8}
  button{background:#5fd3a0;color:#07120d;border:0;font-weight:700;cursor:pointer}
  button.del{background:#3a1c20;color:#f08a8a;padding:4px 10px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .bar input{flex:1;min-width:160px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:8px;border-bottom:1px solid #1c232a;text-align:left;vertical-align:top}
  th{color:#8a96a0;font-weight:600} td.t{word-break:break-word} .s{color:#8a96a0;font-size:12px}
  #msg{color:#8a96a0;margin:8px 0}
</style>
</head>
<body><main>
<h1>📝 방명록 관리자</h1>
<div class="bar"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="login">접속</button></div>
<div class="bar"><input id="q" placeholder="닉네임·내용 검색"><button id="search">검색</button></div>
<div id="msg">토큰을 입력하세요.</div>
<table><thead><tr><th>#</th><th>닉네임</th><th>내용</th><th>IP / 시간</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div class="bar" style="margin-top:12px"><button id="more" hidden>더 보기</button></div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = sessionStorage.getItem('adminToken') || '', offset = 0, total = 0;
$('token').value = token;

async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { 'X-Admin-Token': token, ...(opt.headers || {}) } });
  if (r.status === 403) throw new Error('토큰이 틀렸어요.');
  if (!r.ok) throw new Error('요청 실패 (' + r.status + ')');
  return r.status === 204 ? null : r.json();
}

async function load(reset) {
  if (reset) { offset = 0; $('rows').replaceChildren(); }
  try {
    const q = encodeURIComponent($('q').value.trim());
    const d = await api(`/api/admin/guestbook?offset=${offset}&limit=100&q=${q}`);
    total = d.total; offset += d.items.length;
    for (const e of d.items) $('rows').append(row(e));
    $('msg').textContent = `전체 ${total}개 중 ${offset}개 표시`;
    $('more').hidden = offset >= total;
  } catch (err) { $('msg').textContent = err.message; }
}

function row(e) {
  const tr = document.createElement('tr');
  const cell = (txt, cls) => { const td = document.createElement('td'); td.textContent = txt; if (cls) td.className = cls; return td; };
  const meta = cell(e.ip, 's'); meta.append(document.createElement('br'), new Date(e.created_at).toLocaleString('ko-KR'));
  const del = document.createElement('button'); del.className = 'del'; del.textContent = '삭제';
  del.onclick = async () => {
    if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = '확인'; return; }
    try { await api('/api/guestbook/' + e.id, { method: 'DELETE' }); tr.remove(); total--; offset--; $('msg').textContent = `전체 ${total}개 중 ${offset}개 표시`; }
    catch (err) { $('msg').textContent = err.message; }
  };
  const act = document.createElement('td'); act.append(del);
  tr.append(cell(e.id), cell(e.name || '익명'), cell(e.text, 't'), meta, act);
  return tr;
}

$('login').onclick = () => { token = $('token').value.trim(); sessionStorage.setItem('adminToken', token); load(true); };
$('search').onclick = () => load(true);
$('q').onkeydown = e => { if (e.key === 'Enter') load(true); };
$('more').onclick = () => load(false);
if (token) load(true);
</script>
</body></html>
