services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usagi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usagi}
      POSTGRES_DB: usagi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usagi"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://usagi:${POSTGRES_PASSWORD:-usagi}@db:5432/usagi
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"   # 로컬 확인용 (외부 공개는 cloudflared가 담당)
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN을 .env에 넣어주세요}
    depends_on:
      - web

volumes:
  pgdata:
