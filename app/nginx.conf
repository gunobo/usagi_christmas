server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/    { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header CF-Connecting-IP $http_cf_connecting_ip; }
  location /admin   { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /player  { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /        { try_files $uri $uri/ /index.html; }
}
